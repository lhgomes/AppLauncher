name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build .NET Framework 4.8
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild AppLauncher.sln /t:Restore /p:Configuration=Release

      - name: Build
        run: msbuild AppLauncher.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /p:ContinuousIntegrationBuild=true

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppLauncher-net48
          path: AppLauncher/bin/Release/net48/**
          if-no-files-found: error
          retention-days: 30
